<!-- src/template.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
  <h1>Weather</h1>

  <form id="search-form">
    <input type="text" id="location-input" placeholder="Enter a city...">
    <button type="submit">Search</button>
  </form>

  <div id="weather-display">
    <div id="weather-gif-container"></div>
    <h2 id="location-name"></h2>
    <p id="temperature"></p>
    <p id="feels-like"></p>
    <p id="condition"></p>
    <p id="humidity"></p>
    <p id="wind-speed"></p>
    <button type="button" id="unit-toggle">Show °F</button>
  </div>
</body>
</html>
